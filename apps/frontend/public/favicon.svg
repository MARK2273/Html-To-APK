<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2A26"/>
      <stop offset="100%" stop-color="#1A1816"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF9F5"/>
      <stop offset="100%" stop-color="#EDE8DF"/>
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect width="64" height="64" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="17" stroke="#44403C" stroke-width="1.5" fill="none"/>

  <!-- Phone Body -->
  <rect x="17" y="10" width="30" height="44" rx="7" fill="url(#screen)" stroke="#FAF9F5" stroke-width="1"/>
  
  <!-- Top camera / speaker -->
  <circle cx="32" cy="14" r="1.5" fill="#292524"/>
  
  <!-- Web code to APK symbol -->
  <!-- Left bracket < -->
  <path d="M26 27 L22 31 L26 35" stroke="#292524" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right bracket > -->
  <path d="M38 27 L42 31 L38 35" stroke="#292524" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Middle Android dot / spark -->
  <circle cx="32" cy="31" r="2.2" fill="#10B981"/>

  <!-- Bottom Home indicator pill -->
  <rect x="28" y="49" width="8" height="2" rx="1" fill="#78716C"/>
</svg>

