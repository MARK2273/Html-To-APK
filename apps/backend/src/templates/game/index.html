<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Space Dash Arcade</title>
  <style>
    * { box-sizing: border-box; touch-action: none; user-select: none; }
    body {
      margin: 0;
      padding: 0;
      background: #090d16;
      color: #fff;
      font-family: -apple-system, system-ui, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #gameCanvas {
      background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #090d16 100%);
      border: 2px solid #312e81;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
      max-width: 95vw;
      max-height: 80vh;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 95vw;
      max-width: 400px;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
      color: #a5b4fc;
    }
    .instructions {
      margin-top: 8px;
      font-size: 11px;
      color: #6366f1;
    }
  </style>
</head>
<body>
  <div class="hud">
    <span>SCORE: <span id="scoreText">0</span></span>
    <span>HIGH: <span id="highText">0</span></span>
  </div>
  <canvas id="gameCanvas" width="360" height="560"></canvas>
  <div class="instructions">TAP OR CLICK SCREEN TO BOOST SHIP</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreText = document.getElementById('scoreText');
    const highText = document.getElementById('highText');

    let highScore = parseInt(localStorage.getItem('space_dash_high') || '0', 10);
    highText.innerText = highScore;

    let ship = { x: 80, y: 250, vy: 0, r: 14 };
    let gravity = 0.35;
    let lift = -7;
    let obstacles = [];
    let frame = 0;
    let score = 0;
    let gameOver = false;

    function reset() {
      ship.y = 250;
      ship.vy = 0;
      obstacles = [];
      frame = 0;
      score = 0;
      gameOver = false;
      scoreText.innerText = '0';
    }

    function jump() {
      if (gameOver) {
        reset();
        return;
      }
      ship.vy = lift;
      if (navigator.vibrate) navigator.vibrate(15);
    }

    window.addEventListener('pointerdown', jump);
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') jump();
    });

    function spawnObstacle() {
      const gap = 140;
      const topHeight = Math.floor(Math.random() * (canvas.height - gap - 100)) + 40;
      obstacles.push({
        x: canvas.width,
        top: topHeight,
        bottom: canvas.height - topHeight - gap,
        width: 48,
        passed: false
      });
    }

    function loop() {
      frame++;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!gameOver) {
        ship.vy += gravity;
        ship.y += ship.vy;

        if (ship.y + ship.r > canvas.height || ship.y - ship.r < 0) {
          triggerGameOver();
        }

        if (frame % 100 === 0) spawnObstacle();
      }

      // Draw obstacles
      ctx.fillStyle = '#4338ca';
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        if (!gameOver) obs.x -= 2.5;

        // Top pipe
        ctx.fillStyle = '#4f46e5';
        ctx.fillRect(obs.x, 0, obs.width, obs.top);
        // Bottom pipe
        ctx.fillRect(obs.x, canvas.height - obs.bottom, obs.width, obs.bottom);

        // Collision check
        if (
          ship.x + ship.r > obs.x &&
          ship.x - ship.r < obs.x + obs.width &&
          (ship.y - ship.r < obs.top || ship.y + ship.r > canvas.height - obs.bottom)
        ) {
          triggerGameOver();
        }

        // Score tracking
        if (!obs.passed && obs.x + obs.width < ship.x) {
          obs.passed = true;
          score++;
          scoreText.innerText = score;
          if (score > highScore) {
            highScore = score;
            highText.innerText = highScore;
            localStorage.setItem('space_dash_high', highScore);
          }
        }

        if (obs.x + obs.width < 0) obstacles.splice(i, 1);
      }

      // Draw Ship
      ctx.save();
      ctx.translate(ship.x, ship.y);
      const angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, ship.vy * 0.08));
      ctx.rotate(angle);

      // Rocket Body
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.moveTo(18, 0);
      ctx.lineTo(-12, -10);
      ctx.lineTo(-6, 0);
      ctx.lineTo(-12, 10);
      ctx.closePath();
      ctx.fill();

      // Flame
      if (!gameOver && frame % 4 < 2) {
        ctx.fillStyle = '#f97316';
        ctx.beginPath();
        ctx.moveTo(-6, 0);
        ctx.lineTo(-18, -4);
        ctx.lineTo(-18, 4);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      if (gameOver) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#f43f5e';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('CRASHED!', canvas.width / 2, canvas.height / 2 - 20);

        ctx.fillStyle = '#f8fafc';
        ctx.font = '16px sans-serif';
        ctx.fillText('Final Score: ' + score, canvas.width / 2, canvas.height / 2 + 20);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '13px sans-serif';
        ctx.fillText('Tap to Play Again', canvas.width / 2, canvas.height / 2 + 60);
      }

      requestAnimationFrame(loop);
    }

    function triggerGameOver() {
      if (!gameOver) {
        gameOver = true;
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      }
    }

    loop();
  </script>
</body>
</html>
